name: Weekly official-source monitor
on:
  schedule:
    # Monday 06:41 Japan time (UTC Sunday 21:41)
    - cron: '41 21 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit official pages without changing editorial claims
        run: python scripts/check_sources.py
      - name: Record report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source-state.json data/last-check.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record official-source check'
            git push
          fi
